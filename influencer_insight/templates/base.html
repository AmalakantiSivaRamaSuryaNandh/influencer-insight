<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Discover top sample Instagram influencers by category using NLP and engagement scoring.">
    <title>{% block title %}Influencer Insight{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="{{ url_for('main.home') }}" aria-label="Influencer Insight home">
          <span class="brand-mark" aria-hidden="true">II</span>
          <span>Influencer Insight</span>
        </a>
        <nav aria-label="Primary navigation">
          <a href="{{ url_for('main.home') }}">Home</a>
          <a href="{{ url_for('main.search') }}">Discover</a>
          <a href="{{ url_for('main.methodology') }}">Methodology</a>
        </nav>
      </div>
    </header>

    <main id="main-content">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <p>
          <strong>Influencer Insight</strong> - created by
          <a href="https://github.com/AmalakantiSivaRamaSuryaNandh" target="_blank" rel="noopener noreferrer">Amalakanti Siva Rama Surya Nandh</a>.
        </p>
        <p>Educational project · Sample profiles and metrics are fictional.</p>
      </div>
    </footer>
  </body>
</html>
