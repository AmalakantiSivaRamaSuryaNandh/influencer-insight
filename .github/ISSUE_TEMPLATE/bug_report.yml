name: Bug report
description: Report a reproducible problem in Influencer Insight
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve this educational project.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the exact commands and actions that reproduce the issue.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "Example: 3.12.13"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant error output
      description: Remove passwords, tokens, and personal information first.
      render: shell
